# nefarious-rs configuration
# Rust IRC server for side-by-side testing

General {
    name = "rs.fractalrealities.net";
    description = "nefarious-rs test server";
    numeric = 98;
    hiddenhost = "Users.Network";
};

Admin {
    Location = "Fractal Realities Test Network";
    Contact = "admin@fractalrealities.net";
};

Port {
    port = 6667;
    ssl = no;
};

Port {
    port = 6697;
    ssl = yes;
};

# Server link port (plaintext, for C nefarious to connect to us)
Port {
    port = 4400;
    server = yes;
};

Class {
    name = "Users";
    pingfreq = 1 minutes 30 seconds;
    maxlinks = 100;
    sendq = 160000;
};

Client {
    class = "Users";
    ip = "*";
    maxlinks = 100;
};

# Server classes
Class {
    name = "Server";
    pingfreq = 1 minutes 30 seconds;
    connectfreq = 5 minutes;
    maxlinks = 1;
    sendq = 9000000;
};

# Accept link from C nefarious
Connect {
    name = "testnet.fractalrealities.net";
    host = "172.29.0.2";
    password = "rustlink123";
    port = 4400;
    class = "Server";
    hub;
};

Features {
    NETWORK = "AfterNET";
    SASL_SERVER = "x3.services";
    SASL_DEFAULT_MECHANISMS = "PLAIN,EXTERNAL";
};

# Operator block
Operator {
     name = "oper";
     host = "*@172.16.11.*";
     password = "shmoo";
     class = "Opers";
     local = no;
};

Operator {
     name = "oper";
     host = "*@172.29.0.*";
     password = "shmoo";
     class = "Opers";
     local = no;
};
