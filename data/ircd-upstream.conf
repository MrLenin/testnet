# Local server configuration for nefarious-upstream (stock upstream nefarious)
# This server links to the primary nefarious server (hub)
# Used for backwards-compatibility testing against unmodified nefarious

# Server port for incoming server connections
Port {
     port = 4496;
     server = yes;
};

Port {
     port = 4497;
     server = yes;
     ssl = yes;
};

# Connect block to primary server (hub)
# 5-5e gateway test: uplink DIRECTLY to a CRDT node (hub2/nefarious3) instead
# of the fork-.2 intermediary, so a stock peer exercises the CRDT<->legacy
# gateway head-on.  Plain 4496 (nef3's non-ssl server port).
Connect {
     name = "hub2.fractalrealities.net";
     host = "172.29.0.6";
     password = "serverlink123";
     port = 4496;
     class = "Server";
     hub;
     autoconnect = yes;
};

# Connect block for X3 Services (passive - hub will forward)
Connect {
     name = "x3.services";
     host = "172.29.0.3";
     password = "abcdefg";
     port = 4496;
     class = "Server";
     autoconnect = no;
};

# Operator block
Operator {
     name = "oper";
     host = "*@172.16.11.*";
     password = "$PLAIN$shmoo";
     class = "Opers";
     local = no;
};

Operator {
     name = "oper";
     host = "*@172.29.0.*";
     password = "$PLAIN$shmoo";
     class = "Opers";
     local = no;
};

# UWorld services
UWorld {
     name = "x3.services";
     name = "testnet.fractalrealities.net";
};

# Forward commands to X3 services
Forwards {
        "." = "x3.services";
};

Pseudo "AUTH" {
	name = "authserv";
	nick = "AuthServ@x3.services";
	prepend = "AUTH ";
};

Pseudo "AUTHSERV" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "AS" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "REGISTER" {
        name = "AuthServ";
        nick = "AuthServ@x3.services";
        prepend = "REGISTER ";
};

Pseudo "X3" {
        name = "X3";
	nick = "X3@x3.services";
};

# Jupes (same as primary)
Jupe {
     nick = "X3,OperServ,NickServ,AuthServ,HelpServ,SpamServ,Global";
     nick = "O,O3,IRCop,Oper,net,_net,help";
     nick = "X2,X,W,ChanServ";
};

