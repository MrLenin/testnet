# Local server configuration for nefarious3 (hub2 server)
# This server links to the primary hub (nefarious) and acts as an intermediate hub

# Server port for incoming server connections
Port {
     port = 4496;
     server = yes;
     ssl = no;
};

# Connect block to primary hub (nefarious)
Connect {
     name = "testnet.fractalrealities.net";
     host = "172.29.0.2";
     password = "serverlink123";
     port = 4496;
     class = "Server";
     hub;
     autoconnect = yes;
};

# 5-5e gateway test: stock nefarious-upstream peers DIRECTLY with this CRDT
# node (no fork-.2 intermediary) so we exercise the CRDT<->stock-legacy
# interface head-on.  Passive: upstream dials in (autoconnect = yes on its side).
Connect {
     name = "upstream.fractalrealities.net";
     host = "172.29.0.8";
     password = "serverlink123";
     port = 4496;
     class = "Server";
     hub;
     autoconnect = no;
};

# Connect block for leaf2 (nefarious4) - passive, leaf will connect to us.
# hub; (hub_limit="*", maximum=65535) so servers may sit BEHIND leaf2 — leaf4
# (nefarious6) links up through leaf2 at hop 2; without this hub2 rejects leaf4 with
# NOT_ALLOWED_TO_HUB when leaf2 bursts it.
Connect {
     name = "leaf2.fractalrealities.net";
     host = "172.29.0.7";
     password = "serverlink123";
     port = 4496;
     class = "LeafServer";
     hub;
};

# Connect block for leaf3 (nefarious5) - 3rd CRDT peer, passive. Makes hub2 the
# middle CRDT node (linked to both leaf2 and leaf3) so it can advance its GC
# floor past a split leaf3 and serve it a CR F snapshot on rejoin.
# hub; for the symmetric branch B (leaf5/nefarious7 will link up through leaf3).
Connect {
     name = "leaf3.fractalrealities.net";
     host = "172.29.0.9";
     password = "serverlink123";
     port = 4496;
     class = "LeafServer";
     hub;
};

# Dedicated class for CRDT mesh overlay links (see ircd4.conf) — keeps overlays out
# of the "Server" class. hub2 gains overlays in the 5-node testbed (leaf4/leaf5 link
# their depth-2 nodes back to hub2 so they stay mesh-reachable when their P10 parent
# splits — the R2 recursive keep-alive case).
Class {
     name = "CrdtMesh";
     pingfreq = 1 minutes 30 seconds;
     connectfreq = 30 seconds;
     maxlinks = 10;
     sendq = 9000000;
};

# CRDT-only OVERLAY accept from leaf4 (nefarious6) — PASSIVE. leaf4 (depth-2 under
# leaf2) initiates this redundant CR-only edge so its doc/liveness still reaches hub2
# if the leaf2->hub2 P10 edge drops.
Connect {
     name = "leaf4.fractalrealities.net";
     host = "172.29.0.14";
     password = "serverlink123";
     port = 4496;
     class = "CrdtMesh";
     crdtmesh;
     autoconnect = no;
};

# CRDT-only OVERLAY accept from leaf5 (nefarious7) — PASSIVE. leaf5 (depth-2 under
# leaf3, branch B) initiates this redundant CR-only edge to hub2 (the symmetric twin of
# the leaf4 overlay above).
Connect {
     name = "leaf5.fractalrealities.net";
     host = "172.29.0.15";
     password = "serverlink123";
     port = 4496;
     class = "CrdtMesh";
     crdtmesh;
     autoconnect = no;
};

# Connect block for X3 Services (passive - hub will forward)
Connect {
     name = "x3.services";
     host = "172.29.0.3";
     password = "abcdefg";
     port = 4496;
     class = "Server";
     autoconnect = no;
};

# Operator block
Operator {
     name = "oper";
     host = "*@*";
     password = "$PLAIN$shmoo";
     gline = yes;
     jupe = yes;
     rehash = yes;
     class = "Opers";
     local = no;
};

# UWorld services
UWorld {
     name = "x3.services";
     name = "testnet.fractalrealities.net";
};

# Forward commands to X3 services
Forwards {
        "." = "x3.services";
};

Pseudo "AUTH" {
	name = "authserv";
	nick = "AuthServ@x3.services";
	prepend = "AUTH ";
};

Pseudo "AUTHSERV" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "AS" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "REGISTER" {
        name = "AuthServ";
        nick = "AuthServ@x3.services";
        prepend = "REGISTER ";
};

Pseudo "X3" {
        name = "X3";
	nick = "X3@x3.services";
};

# Jupes (same as primary)
Jupe {
     nick = "X3,OperServ,NickServ,AuthServ,HelpServ,SpamServ,Global";
     nick = "O,O3,IRCop,Oper,net,_net,help";
     nick = "X2,X,W,ChanServ";
};

Keycloak {
  url = "http://keycloak:8080";
  realm = "testnet";
  client_id = "x3-services";
  client_secret = "x3-services-secret";
  # Keycloak is testnet-only; the issuer is an unstable container IP and the
  # SASL client varies, so skip issuer/azp checks here. DEV/TEST ONLY -- do
  # NOT set insecure_token_validation in a production deployment.
  insecure_token_validation = yes;
};

