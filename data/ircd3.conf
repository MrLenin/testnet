  # Enable draft IRCv3 capabilities
  "CAP_draft_event_playback" = "TRUE";
  "CAP_draft_message_redaction" = "TRUE";
  "CAP_draft_account_registration" = "TRUE";
  "CAP_draft_read_marker" = "TRUE";
  "CAP_draft_channel_rename" = "TRUE";
  "CAP_draft_metadata_2" = "TRUE";
  "CAP_draft_webpush" = "TRUE";

  # PM Chathistory consent settings
  "CHATHISTORY_PRIVATE" = "TRUE";

   # Bouncer
   "CAP_draft_bouncer" = "TRUE";
   "BOUNCER_ENABLE" = "TRUE";
   "BOUNCER_DEFAULT_HOLD" = "FALSE";
   "BOUNCER_REQUIRE_TLS" = "FALSE";
   "BOUNCER_ALIASES" = "TRUE";

   # CRDT-mesh shadow mode (Phase 1 demo). Also raise the SYSTEM log level
   # (base.conf sets it to CRIT) so the periodic "CRDT shadow verify" /
   # divergence NOTICE lines are visible in the container log.
   "CRDT_ENABLED" = "TRUE";
   # Phase 3c: CRDT-authoritative initial sync — burst a CR F snapshot to
   # CRDT-aware peers instead of P10 BURST (they materialize from the doc).
   "CRDT_PRIMARY" = "TRUE";
   # S4/R7a: suppress P10 SQUIT (server departure) among CRDT-aware-both-ends
   # peers — departures ride the CR H beacon (stale beacon + keep-gate + sweep).
   # SERVER intros are KEPT: P10's flat-namespace prefix routing needs them for
   # legacy servers relayed behind the mesh (full SERVER retirement would need
   # mesh-native routing). Also enables the S3 precise beacon keep-gate.
   "CRDT_MESHMAP_PRESENCE" = "TRUE";
   # MR-1: route CRDT-aware user-unicast (PRIVMSG/NOTICE/TAGMSG) over CR next-hop
   # instead of the P10 tree (TTL-bounded, flood-fallback). Mesh-stub targets go
   # over CR regardless; this adds live CRDT-aware targets (the primary path).
   "CRDT_ROUTE_UNICAST" = "TRUE";
   # MR-2: forward channel broadcast over the canonical mesh tree (N-1) when the
   # mesh is stable; flood-fallback during convergence flux (msgid+TTL backstops).
   "CRDT_ROUTE_BCAST" = "TRUE";
   "CRDT_ROUTE_WALL" = "TRUE";
   "CRDT_GLINE_CUTOVER" = "TRUE";
   "CRDT_SHUN_CUTOVER" = "TRUE";
   "CRDT_ZLINE_CUTOVER" = "TRUE";
   "CRDT_JUPE_CUTOVER" = "TRUE";
   "CRDT_LEGACY_PRESENCE" = "TRUE";
   "CRDT_GATEWAY_BRIDGE" = "TRUE";
   "CRDT_TREE_RETIRE" = "TRUE";
   "CRDT_SERVICES_BRIDGE" = "TRUE";
   "CRDT_BOUNCER_DOC" = "TRUE";  # 5-5e M6b-1: doc is the authoritative bouncer transport among CRDT peers (BS C/X + BX C/X relay suppressed)
   "CRDT_OWNER_SWEEP" = "TRUE";  # orphan-reap owner sweep: reap own-origin doc user records with no live client (zombie/residue catch-all)
   "CONNECTFREQUENCY" = "30";  # R5: fast overlay re-form (default 600s is too slow for the mesh)
   "LOG" = "SYSTEM" "LEVEL" "INFO";
   "LOG" = "USER" "FILE" "ircd-user.log";  # bounce_auto_resume branch decisions log at LS_USER L_INFO
   "LOG" = "USER" "LEVEL" "INFO";
};
