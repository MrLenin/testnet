# Local server configuration for nefarious4 (leaf2 server)
# This server links to hub2 (nefarious3)

# Server port for incoming server connections
Port {
     port = 4496;
     server = yes;
     ssl = no;
};

# Connect block to hub2 (nefarious3)
Connect {
     name = "hub2.fractalrealities.net";
     host = "172.29.0.6";
     password = "serverlink123";
     port = 4496;
     class = "Server";
     hub;
     autoconnect = yes;
};

# Phase 4b: dedicated class for CRDT mesh overlay links, so they do NOT consume
# slots in the "Server" class (maxlinks=1) and thereby block the canonical hub2
# link's ConfLinks>ConfMaxLinks check in try_connections().
Class {
     name = "CrdtMesh";
     pingfreq = 1 minutes 30 seconds;
     connectfreq = 30 seconds;
     maxlinks = 10;
     sendq = 9000000;
};

# Phase 4b: CRDT-only mesh OVERLAY link to leaf3 (nefarious5).
# This is a REDUNDANT, CR-only edge (NOT a P10 tree edge): nef4 reaches nef5
# canonically via hub2, and this overlay keeps the CRDT doc converged even if
# that P10 path drops. nef4 initiates; nef5 accepts (its passive crdtmesh block).
Connect {
     name = "leaf3.fractalrealities.net";
     host = "172.29.0.9";
     password = "serverlink123";
     port = 4496;
     class = "CrdtMesh";
     crdtmesh;
     autoconnect = yes;
};

# Connect block for leaf4 (nefarious6) — PASSIVE accept of leaf4's P10 downlink.
# leaf4 connects UP to us (branch A depth-2: hub2 -> leaf2 -> leaf4). Uses the
# LeafServer class (maxlinks=0) so it does NOT consume our single "Server" uplink slot.
Connect {
     name = "leaf4.fractalrealities.net";
     host = "172.29.0.14";
     password = "serverlink123";
     port = 4496;
     class = "LeafServer";
     autoconnect = no;
};

# Connect block for X3 Services (passive - hub will forward)
Connect {
     name = "x3.services";
     host = "172.29.0.3";
     password = "abcdefg";
     port = 4496;
     class = "Server";
     autoconnect = no;
};

# Operator block
Operator {
     name = "oper";
     host = "*@*";
     password = "$PLAIN$shmoo";
     gline = yes;
     jupe = yes;
     rehash = yes;
     class = "Opers";
     local = no;
};

# UWorld services
UWorld {
     name = "x3.services";
     name = "testnet.fractalrealities.net";
};

# Forward commands to X3 services
Forwards {
        "." = "x3.services";
};

Pseudo "AUTH" {
	name = "authserv";
	nick = "AuthServ@x3.services";
	prepend = "AUTH ";
};

Pseudo "AUTHSERV" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "AS" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "REGISTER" {
        name = "AuthServ";
        nick = "AuthServ@x3.services";
        prepend = "REGISTER ";
};

Pseudo "X3" {
        name = "X3";
	nick = "X3@x3.services";
};

# Jupes (same as primary)
Jupe {
     nick = "X3,OperServ,NickServ,AuthServ,HelpServ,SpamServ,Global";
     nick = "O,O3,IRCop,Oper,net,_net,help";
     nick = "X2,X,W,ChanServ";
};

Keycloak {
  url = "http://keycloak:8080";
  realm = "testnet";
  client_id = "x3-services";
  client_secret = "x3-services-secret";
  # Keycloak is testnet-only; the issuer is an unstable container IP and the
  # SASL client varies, so skip issuer/azp checks here. DEV/TEST ONLY -- do
  # NOT set insecure_token_validation in a production deployment.
  insecure_token_validation = yes;
};

