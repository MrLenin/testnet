# Local server configuration for nefarious6 (leaf4 server) - DEPTH-2 CRDT node.
# P10 tree: this links UP to leaf2 (nefarious4), which links up to hub2 — so leaf4
# is 2 hops below hub2 (branch A: hub2 -> leaf2 -> leaf4). A CR-only overlay back to
# hub2 keeps leaf4 mesh-reachable when the leaf2-hub2 P10 edge drops (R2 depth test).

# Server port for incoming server connections
Port {
     port = 4496;
     server = yes;
     ssl = no;
};

# Connect block UP to leaf2 (nefarious4) — leaf4's P10 parent (branch A, depth 2)
Connect {
     name = "leaf2.fractalrealities.net";
     host = "172.29.0.7";
     password = "serverlink123";
     port = 4496;
     class = "Server";
     hub;
     autoconnect = yes;
};

# dedicated class for CRDT mesh overlay links (see ircd4.conf) — keeps the overlay
# out of the "Server" class so the canonical uplink is not blocked by
# ConfLinks>ConfMaxLinks (and an overlay reconnect can't starve the uplink relink).
Class {
     name = "CrdtMesh";
     pingfreq = 1 minutes 30 seconds;
     connectfreq = 30 seconds;
     maxlinks = 10;
     sendq = 9000000;
};

# CRDT-only OVERLAY link to hub2 (nefarious3). Redundant CR-only edge (NOT a P10
# tree edge): leaf4 reaches hub2 canonically via leaf2, and this overlay keeps the
# CRDT doc + liveness flowing (and leaf4 mesh-reachable) even if the leaf2->hub2 P10
# edge drops. leaf4 initiates; hub2 accepts (its passive crdtmesh block).
Connect {
     name = "hub2.fractalrealities.net";
     host = "172.29.0.6";
     password = "serverlink123";
     port = 4496;
     class = "CrdtMesh";
     crdtmesh;
     autoconnect = yes;
};

# CRDT-only OVERLAY accept from leaf5 (nefarious7) — PASSIVE. The cross-branch depth-2
# edge (branch A leaf4 <-> branch B leaf5). leaf5 initiates; we accept. Gives a second
# disjoint CR path between the two depth-2 nodes for multi-path routing (R4).
Connect {
     name = "leaf5.fractalrealities.net";
     host = "172.29.0.15";
     password = "serverlink123";
     port = 4496;
     class = "CrdtMesh";
     crdtmesh;
     autoconnect = no;
};

# Connect block for X3 Services (passive - hub will forward)
Connect {
     name = "x3.services";
     host = "172.29.0.3";
     password = "abcdefg";
     port = 4496;
     class = "Server";
     autoconnect = no;
};

# Operator block
Operator {
     name = "oper";
     host = "*@*";
     password = "$PLAIN$shmoo";
     gline = yes;
     jupe = yes;
     rehash = yes;
     class = "Opers";
     local = no;
};

# UWorld services
UWorld {
     name = "x3.services";
     name = "testnet.fractalrealities.net";
};

# Forward commands to X3 services
Forwards {
        "." = "x3.services";
};

Pseudo "AUTH" {
	name = "authserv";
	nick = "AuthServ@x3.services";
	prepend = "AUTH ";
};

Pseudo "AUTHSERV" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "AS" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "REGISTER" {
        name = "AuthServ";
        nick = "AuthServ@x3.services";
        prepend = "REGISTER ";
};

Pseudo "X3" {
        name = "X3";
	nick = "X3@x3.services";
};

# Jupes (same as primary)
Jupe {
     nick = "X3,OperServ,NickServ,AuthServ,HelpServ,SpamServ,Global";
     nick = "O,O3,IRCop,Oper,net,_net,help";
     nick = "X2,X,W,ChanServ";
};

Keycloak {
  url = "http://keycloak:8080";
  realm = "testnet";
  client_id = "x3-services";
  client_secret = "x3-services-secret";
  # Keycloak is testnet-only; the issuer is an unstable container IP and the
  # SASL client varies, so skip issuer/azp checks here. DEV/TEST ONLY -- do
  # NOT set insecure_token_validation in a production deployment.
  insecure_token_validation = yes;
};

