# Local server configuration for nefarious7 (leaf5 server) - DEPTH-2 CRDT node.
# P10 tree: this links UP to leaf3 (nefarious5), which links up to hub2 — so leaf5
# is 2 hops below hub2 (branch B: hub2 -> leaf3 -> leaf5). CR-only overlays back to
# hub2 AND across to leaf4 keep leaf5 mesh-reachable when the leaf3-hub2 P10 edge drops
# (R2 depth test) and give multi-path CR routing for R4.

# Server port for incoming server connections
Port {
     port = 4496;
     server = yes;
     ssl = no;
};

# Connect block UP to leaf3 (nefarious5) — leaf5's P10 parent (branch B, depth 2)
Connect {
     name = "leaf3.fractalrealities.net";
     host = "172.29.0.9";
     password = "serverlink123";
     port = 4496;
     class = "Server";
     hub;
     autoconnect = yes;
};

# dedicated class for CRDT mesh overlay links — keeps overlays out of the "Server"
# class so the canonical uplink is not blocked by ConfLinks>ConfMaxLinks.
Class {
     name = "CrdtMesh";
     pingfreq = 1 minutes 30 seconds;
     connectfreq = 30 seconds;
     maxlinks = 10;
     sendq = 9000000;
};

# CRDT-only OVERLAY link to hub2 (nefarious3). Redundant CR-only edge: leaf5 reaches
# hub2 canonically via leaf3, this overlay keeps its doc/liveness flowing if the
# leaf3->hub2 P10 edge drops. leaf5 initiates; hub2 accepts.
Connect {
     name = "hub2.fractalrealities.net";
     host = "172.29.0.6";
     password = "serverlink123";
     port = 4496;
     class = "CrdtMesh";
     crdtmesh;
     autoconnect = yes;
};

# CRDT-only OVERLAY link to leaf4 (nefarious6) — the cross-branch depth-2 edge
# (branch A leaf4 <-> branch B leaf5). Gives a second disjoint CR path between the
# two depth-2 nodes for multi-path routing (R4). leaf5 initiates; leaf4 accepts.
Connect {
     name = "leaf4.fractalrealities.net";
     host = "172.29.0.14";
     password = "serverlink123";
     port = 4496;
     class = "CrdtMesh";
     crdtmesh;
     autoconnect = yes;
};

# Connect block for X3 Services (passive - hub will forward)
Connect {
     name = "x3.services";
     host = "172.29.0.3";
     password = "abcdefg";
     port = 4496;
     class = "Server";
     autoconnect = no;
};

# Operator block
Operator {
     name = "oper";
     host = "*@*";
     password = "$PLAIN$shmoo";
     gline = yes;
     jupe = yes;
     rehash = yes;
     class = "Opers";
     local = no;
     swhois = "F1-SWHOIS-mesh-converged";
};

# UWorld services
UWorld {
     name = "x3.services";
     name = "testnet.fractalrealities.net";
};

# Forward commands to X3 services
Forwards {
        "." = "x3.services";
};

Pseudo "AUTH" {
	name = "authserv";
	nick = "AuthServ@x3.services";
	prepend = "AUTH ";
};

Pseudo "AUTHSERV" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "AS" {
        name = "authserv";
        nick = "AuthServ@x3.services";
};

Pseudo "REGISTER" {
        name = "AuthServ";
        nick = "AuthServ@x3.services";
        prepend = "REGISTER ";
};

Pseudo "X3" {
        name = "X3";
	nick = "X3@x3.services";
};

# Jupes (same as primary)
Jupe {
     nick = "X3,OperServ,NickServ,AuthServ,HelpServ,SpamServ,Global";
     nick = "O,O3,IRCop,Oper,net,_net,help";
     nick = "X2,X,W,ChanServ";
};

Keycloak {
  url = "http://keycloak:8080";
  realm = "testnet";
  client_id = "x3-services";
  client_secret = "x3-services-secret";
  # Keycloak is testnet-only; the issuer is an unstable container IP and the
  # SASL client varies, so skip issuer/azp checks here. DEV/TEST ONLY -- do
  # NOT set insecure_token_validation in a production deployment.
  insecure_token_validation = yes;
};

