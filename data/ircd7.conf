   # CRDT-mesh sync (Phase 2 demo) + raise SYSTEM log level so CRDT/verify
   # NOTICE lines are visible (base.conf sets it to CRIT).
   "CRDT_ENABLED" = "TRUE";
   # Phase 3c: CRDT-authoritative initial sync — peers skip P10 BURST and send a
   # CR F snapshot; this leaf materializes live state from the doc instead.
   "CRDT_PRIMARY" = "TRUE";
   # S4/R7a: suppress P10 SQUIT (server departure) among CRDT-aware-both-ends
   # peers — departures ride the CR H beacon (stale beacon + keep-gate + sweep).
   # SERVER intros are KEPT: P10's flat-namespace prefix routing needs them for
   # legacy servers relayed behind the mesh (full SERVER retirement would need
   # mesh-native routing). Also enables the S3 precise beacon keep-gate.
   "CRDT_MESHMAP_PRESENCE" = "TRUE";
   # MR-1: route CRDT-aware user-unicast over CR next-hop (TTL-bounded, flood-fallback).
   "CRDT_ROUTE_UNICAST" = "TRUE";
   # MR-2: forward channel broadcast over the canonical mesh tree (flood-fallback during flux).
   "CRDT_ROUTE_BCAST" = "TRUE";
   "CRDT_GLINE_CUTOVER" = "TRUE";
   "CRDT_SHUN_CUTOVER" = "TRUE";
   "CRDT_ZLINE_CUTOVER" = "TRUE";
   "CRDT_JUPE_CUTOVER" = "TRUE";
   "CRDT_LEGACY_PRESENCE" = "TRUE";
   "CRDT_GATEWAY_BRIDGE" = "TRUE";
   "CRDT_TREE_RETIRE" = "TRUE";
   "CRDT_SERVICES_BRIDGE" = "TRUE";
   "CRDT_BOUNCER_DOC" = "TRUE";  # 5-5e M6b-1: doc-authoritative bouncer transport (BS C/X + BX C/X suppressed among CRDT peers)
   "CRDT_OWNER_SWEEP" = "TRUE";  # orphan-reap owner sweep: reap own-origin doc user records with no live client (zombie/residue catch-all)
   "CONNECTFREQUENCY" = "30";  # R5: fast overlay re-form (default 600s is too slow for the mesh)
   "LOG" = "SYSTEM" "LEVEL" "INFO";
   "LOG" = "USER" "FILE" "ircd-user.log";  # bounce_auto_resume branch decisions log at LS_USER L_INFO
   "LOG" = "USER" "LEVEL" "INFO";
};
