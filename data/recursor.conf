# PowerDNS Recursor YAML configuration for Consul DNS forwarding
recursor:
  # Forward .consul zone to Consul DNS servers
  forward_zones:
    - zone: consul
      forwarders:
        - 172.16.10.112:8600
        - 172.16.10.117:8600
        - 172.16.10.7:8600

incoming:
  # Allow queries from Docker network
  allow_from:
    - 172.29.0.0/24
    - 127.0.0.0/8
  # Listen on all interfaces
  listen:
    - 0.0.0.0:53

outgoing:
  # CRITICAL: Allow queries to private IPs (Consul servers at 172.16.x.x)
  # Default blocks RFC1918 ranges, we only block loopback
  dont_query:
    - 127.0.0.0/8
    - "::1/128"
